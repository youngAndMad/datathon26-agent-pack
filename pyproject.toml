[project]
name = "cashwatch"
version = "0.1.0"
description = "Local cashier video analysis service for ForteBank Datathon 26 (local inference only)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (team submission); third-party licenses in docs/submission/LICENSES.md" }
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "python-multipart==0.0.32",
  "av==19.0.1",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
# Apple Silicon native perception profile (MLX). Install with: uv sync --extra mlx
mlx = [
  "mlx==0.32.4",
  "mlx-vlm==0.7.8",
]
# Transformers/PyTorch profile (CUDA hosts or MPS). Install with: uv sync --extra torch
torch = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.20.1",
  "accelerate==1.15.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[project.scripts]
cashwatch-api = "cashwatch.api.main:run"
cashwatch-worker = "cashwatch.pipeline.worker:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashwatch"]

[tool.uv]
# No implicit network at runtime; lock is resolved during preparation only.
conflicts = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "model: requires local model weights and accelerator (real inference)",
  "slow: long-running media/integration test",
  "offline: denied-egress verification",
]
