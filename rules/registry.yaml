rules:
  - rule_id: CW01
    version: "0.1.0"
    state: disabled
    disabled_reason: "Нет локальной визуальной валидации (D004); применимость к записям не проверена."
    symbol: ACTIVE_RECEIPT_DEPARTURE
    type_ru: "Выход кассира до завершения обслуживания клиента"
    source_id: L01
    clause: "22"
    excerpt_ids: [L01-p22]
    source_status:
      clause_text: verified
      edition: verified
      applicability: unverified
      local_visual_validation: blocked
      notes: "п. 22 находится в параграфе 2 «Порядок осуществления кассовых операций по приему наличных денег»; сноски об изменении п. 22 в консолидированном тексте нет."
    last_verified: "2026-10-17"
    paraphrase_ru: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
    applicability_en:
      - "Applies only to a staff member at a teller work position who is serving a customer at the counter."
      - "Service must have visibly started and must not have visibly ended when the staff member leaves."
    nonvisual_prerequisites_en:
      - "Whether the person is a cashier (кассовый работник) is established only from scene interaction, never from identity or appearance."
    predicates:
      - {predicate_id: CW01.service_in_progress, kind: trigger, required_state: supported, question_en: "Is a cash or document service interaction visibly in progress between a person on the customer side of the counter and a staff member at the teller work position?", counterexamples_en: ["The customer is only waiting in a queue and service has not started.", "The staff member is working alone with no customer at the counter."]}
      - {predicate_id: CW01.leaves_position, kind: decisive, anchor: true, required_state: supported, question_en: "Does the staff member who was serving at the teller work position move fully away from that work position (out of the work area or out of the frame) while the customer is still at the counter?", counterexamples_en: ["The staff member stands up, turns or reaches within the work position.", "The staff member steps one pace aside and stays at the work position."]}
      - {predicate_id: CW01.service_unfinished, kind: decisive, required_state: supported, question_en: "At the moment the staff member leaves, is the service visibly unfinished (customer still waiting at the counter, or the customer's cash/documents still on the counter)?", counterexamples_en: ["The customer has already received everything and is leaving."]}
      - {predicate_id: CW01.area_visible, kind: visibility, required_state: supported, question_en: "Are the teller work position and the customer side of the counter both visible throughout the interval?", counterexamples_en: []}
      - {predicate_id: CW01.excl_service_ended, kind: exclusion, required_state: not_supported, question_en: "Had the service interaction visibly ended (customer gone or handed everything) before the staff member left?", counterexamples_en: []}
    counterexamples_en:
      - "Standing up or reaching while staying at the work position."
      - "Leaving after the transaction is visibly finished."
      - "Customer waiting before service started."
      - "Unclear role or zone."
    boundary_notes_en:
      - "Leaving means the person is no longer at the work position; a short turn or reach is not leaving."
    visibility_requirements_en:
      - "Teller position and customer side visible from service start until the departure."
    temporal: {kind: action, transition_from: null, context_before_sec: 3.0, context_after_sec: 3.0, requires_complete_interval: false, max_frame_gap_sec: null}
    anchor_convention: first_anchor_supported
    evidence_strategy: anchor_then_context
    explanation:
      template_id: CW01.v1
      fact_ru: "кассовый работник отходит от рабочего места, пока клиент остаётся у кассы и обслуживание не завершено"
      interpretation_ru: "оставление рабочего места до окончания обслуживания клиента"
      predicate_ru: "работник покидает рабочее место при видимо незавершённом обслуживании клиента"
    limitations_ru:
      - "Роль работника установлена только по взаимодействию в кадре."
      - "Завершённость обслуживания оценивается только по видимым действиям."
    approval: {owner: null, date: null, validation_counts: null, notes: "not approved"}

  - rule_id: CW02
    version: "0.1.0"
    state: disabled
    disabled_reason: "Нет локальной визуальной валидации (D004); состояние запирания хранилища невидимо."
    symbol: PRIOR_BATCH_NOT_STORED
    type_ru: "Наличные предыдущего клиента вне места хранения"
    source_id: L01
    clause: "20 (часть вторая)"
    excerpt_ids: [L01-p20]
    source_status:
      clause_text: verified
      edition: verified
      applicability: unverified
      local_visual_validation: blocked
      notes: "п. 20 часть вторая: на рабочем месте находятся наличные деньги клиента; ранее принятые наличные хранятся в запирающихся устройствах на рабочем месте. Сноски об изменении п. 20 нет."
    last_verified: "2026-10-17"
    paraphrase_ru: "На рабочем месте кассира должны находиться только наличные текущего клиента; ранее принятые наличные хранятся в запирающихся на ключ устройствах (шкаф, сейф, тележка, ящики стола, тумба)."
    applicability_en:
      - "Applies to cash received from one customer that remains openly on the work surface after the next customer's service starts."
    nonvisual_prerequisites_en:
      - "Whether a drawer or cabinet is locked is not visible and is never asserted."
    predicates:
      - {predicate_id: CW02.prior_receipt_completed, kind: trigger, required_state: supported, question_en: "Is cash received from a first customer visibly placed on the teller work surface, after which that customer's service visibly ends (the customer leaves the counter)?", counterexamples_en: ["A pile already lies on the desk at the start of the clip with unknown origin."]}
      - {predicate_id: CW02.next_client_prior_cash_on_surface, kind: decisive, anchor: true, required_state: supported, question_en: "Does a different, next customer begin being served while the cash from the previous customer still lies openly on the work surface (not placed into a drawer, safe, cabinet, cart or other storage device)?", counterexamples_en: ["The cash on the surface belongs to the current customer.", "The items are paper forms or receipts, not banknotes."]}
      - {predicate_id: CW02.surface_visible, kind: visibility, required_state: supported, question_en: "Is the teller work surface visible from the first customer's receipt until the next customer's service starts?", counterexamples_en: []}
      - {predicate_id: CW02.excl_paper_or_current, kind: exclusion, required_state: not_supported, question_en: "Could the items on the work surface be documents/paper or cash belonging to the current customer?", counterexamples_en: []}
    counterexamples_en:
      - "Initial unidentified pile."
      - "Current customer's batch."
      - "Paper mistaken for cash."
    boundary_notes_en:
      - "Do not assume drawers are locked or unlocked."
    visibility_requirements_en:
      - "Work surface continuously visible across the customer change."
    temporal: {kind: transition, transition_from: CW02.prior_receipt_completed, context_before_sec: 6.0, context_after_sec: 3.0, requires_complete_interval: false, max_frame_gap_sec: null}
    anchor_convention: first_anchor_supported
    evidence_strategy: anchor_then_context
    explanation:
      template_id: CW02.v1
      fact_ru: "наличные предыдущего клиента остаются на рабочем столе при начале обслуживания следующего клиента"
      interpretation_ru: "нахождение ранее принятых наличных вне предназначенных для их хранения устройств"
      predicate_ru: "ранее принятые наличные не убраны в шкаф, сейф, тележку, ящик стола или тумбу"
    limitations_ru:
      - "Состояние запирания устройств хранения по видео не устанавливается."
    approval: {owner: null, date: null, validation_counts: null, notes: "not approved"}

  - rule_id: CW03
    version: "0.1.0"
    state: disabled
    disabled_reason: "Нет локальной визуальной валидации (D004)."
    symbol: RECEIPT_CLIENT_ABSENT
    type_ru: "Приём или пересчёт без присутствия клиента"
    source_id: L01
    clause: "20 (часть первая)"
    excerpt_ids: [L01-p20]
    source_status:
      clause_text: verified
      edition: verified
      applicability: unverified
      local_visual_validation: blocked
      notes: "п. 20 часть первая: наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента. Внутренний пересчёт регулируется п. 42 (не этим правилом)."
    last_verified: "2026-10-17"
    paraphrase_ru: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
    applicability_en:
      - "Applies only to receipt of a customer's cash at the counter, not to internal counting."
    nonvisual_prerequisites_en:
      - "Whether the counting relates to a customer receipt is established only from visible interaction."
    predicates:
      - {predicate_id: CW03.counting_receipt, kind: trigger, required_state: supported, question_en: "Is the staff member at the teller work position counting or accepting loose banknotes that were just handed over across the counter?", counterexamples_en: ["End-of-day or internal counting with no customer transaction."]}
      - {predicate_id: CW03.client_area_empty, kind: decisive, anchor: true, required_state: supported, question_en: "During that counting or acceptance, is the customer side of the counter fully visible and empty of any customer?", counterexamples_en: ["The customer may stand outside the camera view."]}
      - {predicate_id: CW03.client_area_visible, kind: visibility, required_state: supported, question_en: "Is the entire customer-side area in front of the teller position inside the frame and unobstructed during the counting?", counterexamples_en: []}
      - {predicate_id: CW03.excl_internal_counting, kind: exclusion, required_state: not_supported, question_en: "Is this an internal counting/sorting operation unrelated to a customer receipt?", counterexamples_en: []}
    counterexamples_en:
      - "Customer outside the crop."
      - "Uncertain transaction."
      - "Clip starts after the customer left."
    boundary_notes_en:
      - "Absence of a customer counts only if the whole customer area is visible."
    visibility_requirements_en:
      - "Full customer-side area visible during the counting."
    temporal: {kind: state, transition_from: null, context_before_sec: 3.0, context_after_sec: 3.0, requires_complete_interval: false, max_frame_gap_sec: null}
    anchor_convention: first_all_supported
    evidence_strategy: anchor_then_context
    explanation:
      template_id: CW03.v1
      fact_ru: "пересчёт принимаемых наличных выполняется при отсутствии клиента в полностью видимой зоне у кассы"
      interpretation_ru: "приём и пересчёт наличных денег не в присутствии клиента"
      predicate_ru: "зона клиента полностью видна и клиент в ней отсутствует во время пересчёта"
    limitations_ru:
      - "Клиент может находиться вне кадра; оценивается только видимая зона."
    approval: {owner: null, date: null, validation_counts: null, notes: "not approved"}

  - rule_id: CW04
    version: "0.1.0"
    state: disabled
    disabled_reason: "Нет локальной визуальной валидации (D004); не проверено, относится ли рабочее место кассира на записях к кассовому узлу (п. 5)."
    symbol: PERSONAL_ITEM_IN_CASH_UNIT
    type_ru: "Личные вещи сотрудника в кассовом узле"
    source_id: L01
    clause: "12"
    excerpt_ids: [L01-p12, L01-p12-note, L01-p5]
    source_status:
      clause_text: verified
      edition: verified
      applicability: unverified
      local_visual_validation: blocked
      notes: "п. 12 в редакции постановления НБРК от 10.11.2025 № 71 (L02, сверено с текстом изменения L02-amend-p12). Исключения: лекарственные средства, медицинские изделия, средства связи без функции фото- и видеофиксации. Кассовый узел определён в п. 5."
    last_verified: "2026-10-17"
    paraphrase_ru: "Личные вещи, наличные деньги и ценности работников банка хранятся вне кассового узла; допускается внос лекарств, медицинских изделий и средств связи без функции фото- и видеофиксации."
    applicability_en:
      - "Applies only inside a cash unit (кассовый узел) and only to items belonging to bank staff."
    nonvisual_prerequisites_en:
      - "Ownership of an item and whether a device can take photos/video are often not visible; then unknown."
      - "Whether the filmed area is part of a cash unit must be confirmed for the site, not inferred."
    predicates:
      - {predicate_id: CW04.item_in_work_area, kind: trigger, required_state: supported, question_en: "Is a bag, handbag, backpack, wallet or mobile phone visible inside the staff work area behind the teller counter?", counterexamples_en: ["The item is on the customer side of the counter."]}
      - {predicate_id: CW04.item_is_staff_personal, kind: decisive, anchor: true, required_state: supported, question_en: "Is the item clearly the staff member's own (brought in, kept or used by the staff member), and if it is a phone, is a camera lens visible on it?", counterexamples_en: ["A customer's item handed over during service.", "A bank device: scanner, card terminal, calculator, counting machine.", "A medicine or medical item."]}
      - {predicate_id: CW04.area_visible, kind: visibility, required_state: supported, question_en: "Is the item clearly visible (not blurred or mostly occluded) in the staff work area?", counterexamples_en: []}
      - {predicate_id: CW04.excl_permitted_item, kind: exclusion, required_state: not_supported, question_en: "Could the item be a customer's item, bank equipment, a medicine/medical item, or a communication device without a camera?", counterexamples_en: []}
    counterexamples_en:
      - "Client device."
      - "Bank scanner or calculator."
      - "Permitted non-camera device."
      - "Medical item."
      - "Uncertain ownership."
    boundary_notes_en:
      - "Do not infer ownership from appearance of the person."
    visibility_requirements_en:
      - "Item and its location clearly visible."
    temporal: {kind: state, transition_from: null, context_before_sec: 2.0, context_after_sec: 2.0, requires_complete_interval: false, max_frame_gap_sec: null}
    anchor_convention: first_all_supported
    evidence_strategy: anchor_then_context
    explanation:
      template_id: CW04.v1
      fact_ru: "в рабочей зоне кассового работника находится личная вещь работника"
      interpretation_ru: "хранение личных вещей работника в кассовом узле"
      predicate_ru: "предмет относится к личным вещам работника и не подпадает под допустимые исключения"
    limitations_ru:
      - "Принадлежность предмета и наличие камеры у устройства оцениваются только визуально."
    approval: {owner: null, date: null, validation_counts: null, notes: "not approved"}

  - rule_id: CW05
    version: "0.1.0"
    state: disabled
    disabled_reason: "Пропуск действия требует полного видимого интервала; нет локальной валидации (D004)."
    symbol: REQUIRED_COUNT_OMITTED
    type_ru: "Признаки пропуска обязательного пересчёта"
    source_id: L01
    clause: "19 (подпункт 2)), 31 (подпункт 4)); исключения — п. 32"
    excerpt_ids: [L01-p19, L01-p19-note, L01-p31, L01-p32]
    source_status:
      clause_text: verified
      edition: verified
