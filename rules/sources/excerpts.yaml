  end: 27216
  text: 6. Настоящее постановление вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования, за исключением абзацев пятнадцатого, шестнадцатого, семнадцатого, восемнадцатого, девятнадцатого, двадцатого, двадцать первого, двадцать шестого, двадцать седьмого, тридцатого, тридцать первого, тридцать второго, тридцать третьего, тридцать четвертого, тридцать пятого, тридцать шестого, тридцать седьмого, тридцать восьмого, тридцать девятого, сорокового, сорок первого, сорок второго, сорок третьего, сорок шестого пункта 1, абзацев тридцать второго, тридцать третьего, сорок второго, сорок третьего, сорок четвертого, сорок пятого пункта 2 настоящего постановления, которые вводятся в действие с 12 июля 2026 года.
