  start: 14981
  end: 15359
  text: "подпункты 2) и 3) пункта 19 изложить в следующей редакции:\n \"2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;\n 3) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;\";"
- excerpt_id: L03-p5
  source_id: L03
  label: п. 5 (введение в действие)
  text_file: L03-2026-10-17.txt
  text_sha256: 8e289c3dddee380e6b083708e8fdd47904ddfdb79f1b0f1c01b6770c7dab9d7b
  start: 1649
  end: 2299
  text: 5. Настоящее постановление вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования, за исключением абзацев тринадцатого, четырнадцатого, пятнадцатого и шестнадцатого пункта 1, абзацев девятого, десятого, одиннадцатого, двенадцатого, тринадцатого, четырнадцатого, пятнадцатого, шестнадцатого, семнадцатого, восемнадцатого, девятнадцатого, двадцатого, двадцать первого, двадцать второго, двадцать третьего и двадцать четвертого пункта 2, а также пункта 3 Перечня, которые вводятся в действие по истечении девяноста календарных дней после дня первого официального опубликования настоящего постановления.
- excerpt_id: L03-amend-p31
