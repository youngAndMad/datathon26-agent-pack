  end: 12008
  text: "пункт 31 изложить в следующей редакции:\n \"31. Кассовый работник банка осуществляет следующие действия:\n 1) проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов;\n 2) проверяет наличие подписи клиента, при наличии подписи операционного работника, сверяет их с имеющимися образцами подписей;\n 3) подготавливает сумму наличных денег, подлежащую выдаче;\n 4) пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;\n 5) подписывает все экземпляры расходного кассового документа и проставляет штамп кассового работника банка на всех экземплярах расходного кассового документа;\n 6) выдает клиенту документ, подтверждающий проведение кассовой операции по выдаче наличных денег.\";"
