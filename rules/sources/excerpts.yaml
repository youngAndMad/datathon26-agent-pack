- excerpt_id: L01-p5
  source_id: L01
  label: п. 5 (кассовый узел)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 16543
  end: 17517
  text: 5. Банк для осуществления кассовых операций оборудует кассовый узел – систему специально оборудованных помещений, предназначенных для проведения кассовых операций и операций по инкассации банкнот, монет и ценностей, устройство которого определяется Правилами организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, утвержденными постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14, зарегистрированным в Реестре государственной регистрации нормативных правовых актов под № 20075, (далее – Правила организации охраны и устройства помещений).
- excerpt_id: L01-p2-10
  source_id: L01
  label: п. 2 пп. 10) (кассовый работник)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 11783
  end: 11856
  text: 10) кассовый работник – работник банка, осуществляющий кассовые операции;
- excerpt_id: L01-p12
  source_id: L01
  label: п. 12
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 20371
  end: 20685
  text: "12. Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка.\n Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."
- excerpt_id: L01-p12-note
  source_id: L01
  label: сноска к п. 12
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 20687
  end: 20891
  text: Сноска. Пункт 12 – в редакции постановления Правления Национального Банка РК от 10.11.2025 № 71 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
- excerpt_id: L01-p19
  source_id: L01
  label: п. 19
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 23280
  end: 24278
  text: "19. Кассовый работник банка осуществляет следующие действия:\n 1) проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;\n 2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;\n 3) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;\n 4) сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег;\n 5) подписывает все экземпляры приходного кассового документа, проставляет штамп кассового работника банка на всех экземплярах приходного кассового документа;\n 6) выдает клиенту документ, подтверждающий проведение кассовой операции по приему наличных денег."
- excerpt_id: L01-p19-note
  source_id: L01
  label: сноска к п. 19
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 24280
  end: 24716
  text: Сноска. Пункт 19 - в редакции приказа постановления Правления Национального Банка РК от 28.02.2022 № 19 (вводится в действие по истечении девяноста календарных дней после дня первого официального опубликования настоящего постановления); с изменением, внесенным постановлением Правления Национального Банка РК от 10.11.2025 № 71 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
- excerpt_id: L01-p20
  source_id: L01
  label: п. 20
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 24718
  end: 25128
  text: "20. Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.\n На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
- excerpt_id: L01-p22
  source_id: L01
  label: п. 22
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 25334
  end: 25430
  text: 22. Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
- excerpt_id: L01-p24
  source_id: L01
  label: п. 24
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 25855
  end: 26438
  text: "24. Кассовые операции по приему наличных денег клиента от подразделения инкассации банка или инкассаторской организации осуществляется кассовым работником банка на основании препроводительного документа, соответствующего требованиям пункта 106 Правил. \n Кассовый работник:\n 1) проверяет указание на препроводительном документе необходимых сведений, предусмотренных пунктом 106 Правил;\n 2) осуществляет регистрацию суммы принимаемых наличных денег в порядке, установленном внутренними документами банка;\n 3) проверяет целостность сумки;\n 4) проверяет правильность пломбирования сумки."
- excerpt_id: L01-p25
  source_id: L01
  label: п. 25
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 26440
  end: 26864
  text: "25. В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности.\n При обнаружении недостачи или излишка составляется акт о результатах пересчета для принятия мер по выявлению причин недостачи или излишков в порядке, установленном внутренними документами банка."
- excerpt_id: L01-p31
  source_id: L01
  label: п. 31
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 29567
  end: 30410
  text: "31. Кассовый работник банка осуществляет следующие действия:\n 1) проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов;\n 2) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;\n 3) подготавливает сумму наличных денег, подлежащую выдаче;\n 4) пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;\n 5) подписывает все экземпляры расходного кассового документа и проставляет штамп кассового работника банка на всех экземплярах расходного кассового документа;\n 6) выдает клиенту документ, подтверждающий проведение кассовой операции по выдаче наличных денег."
- excerpt_id: L01-p32
  source_id: L01
  label: п. 32
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 30842
  end: 31392
  text: "32. Кассовый работник выдает клиенту банкноты полными, неполными пачками и (или) отдельными корешками банкнот по обозначенным на упаковке суммам без полистного пересчета при условии сохранения неповрежденной упаковки. Банкноты из неполных, а также поврежденных корешков выдаются кассовым работником полистным пересчетом.\n Монеты, упакованные в мешки, выдаются по надписям на ярлыках, прикрепленных к мешкам, а упакованные в пакеты (тюбики, коробки) – по надписям на них. Монеты из неполных мешков выдаются кассовым работником с пересчетом по кружкам."
- excerpt_id: L01-p42
  source_id: L01
  label: п. 42
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 34391
  end: 34634
  text: 42. Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту.
- excerpt_id: L01-p107
  source_id: L01
  label: п. 107
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 73267
  end: 73685
  text: "107. Прием банкнот, монет и ценностей от клиентов осуществляется инкассатором-сборщиком, который проверяет:\n 1) целостность сумки;\n 2) правильность пломбирования (целостность шпагата, на котором закреплена пломба, ясность оттиска пломбиратора, тождественность его образцу);\n 3) правильность заполнения явочной карточки клиентом;\n 4) указание на препроводительном документе сведений, предусмотренных пунктом 106 Правил."
- excerpt_id: L02-p4
  source_id: L02
  label: п. 4 (введение в действие)
  text_file: L02-2026-10-17.txt
  text_sha256: 5396db5727a623e4adf2e3202a972a32e3c34312bb3a902f357a6b1e258001d5
  start: 1302
  end: 1761
  text: 4. Настоящее постановление вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования, за исключением абзацев восьмого, девятого, десятого, одиннадцатого, двенадцатого, тринадцатого, четырнадцатого, пятнадцатого, шестнадцатого, семнадцатого, восемнадцатого, девятнадцатого, двадцатого, двадцать первого, двадцать второго пункта 3 Перечня и приложения 1 к Перечню, которые вводятся в действие с 1января 2026 года.
