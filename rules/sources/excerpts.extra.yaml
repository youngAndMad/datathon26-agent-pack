excerpts:
- excerpt_id: L01-p2-9
  source_id: L01
  label: п. 2 пп. 9) (касса)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 11632
  end: 11781
  text: 9) касса – специально оборудованное помещение для осуществления кассовых операций по приему, выдаче, пересчету, сортировке и упаковке наличных денег;
- excerpt_id: L01-p2-14
  source_id: L01
  label: п. 2 пп. 14) (кладовая)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 12416
  end: 12523
  text: 14) кладовая – специально оборудованное помещение, предназначенное для хранения наличных денег и ценностей;
- excerpt_id: L01-p2-16
  source_id: L01
  label: п. 2 пп. 16) (лица, ответственные за сохранность; не менее двух)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 12601
  end: 13019
  text: "16) лица, ответственные за сохранность наличных денег – назначенные внутренним распорядительным документом банка уполномоченный работник и кассовый работник, ответственные за сохранность наличных денег, находящихся на хранении в кладовой и (или) сейфовой комнате, а также лица их замещающие.\n Количество лиц, ответственных за сохранность наличных денег, определяется банком самостоятельно, но не менее двух работников;"
- excerpt_id: L01-p2-17
  source_id: L01
  label: п. 2 пп. 17) (ценности, вкл. ключи)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 13021
  end: 13417
  text: 17) ценности – платежные документы, бланки документов, ценные бумаги, драгоценные металлы, драгоценные камни, изделия из драгоценных металлов и драгоценных камней, ключи (дубликаты ключей) от кладовых (сейфовых комнат), сейфовых депозитариев, устройств, функционирующих в автоматическом режиме и кассет к ним, электронные (цифровые) носители, на которых хранится банковская защищаемая информация;
- excerpt_id: L01-p2-20
  source_id: L01
  label: п. 2 пп. 20) (сейфовая комната)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 13775
  end: 13945
  text: 20) сейфовая комната – специально оборудованное помещение, в котором устанавливаются сейфы (металлические шкафы), предназначенные для хранения наличных денег и ценностей;
- excerpt_id: L01-p6
  source_id: L01
  label: п. 6 (темпокасса, темпосейф)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 17725
  end: 18395
  text: "6. Допускается осуществление кассовых операций с применением устройств, функционирующих в автоматическом режиме, в том числе:\n 1) электронного устройства – электронно-механического устройства, предназначенного для кассовых операций по приему и (или) выдаче наличных денег либо для осуществления иных видов операций, а также формирования соответствующих подтверждающих документов (банкомат, электронный терминал и иные устройства);\n 2) темпокассы – сейфа для приема наличных денег с функцией задержки времени на открытие, неавтоматизированной выдачи наличных денег и их хранения;\n 3) темпосейфа – сейфа для хранения наличных денег с функцией задержки времени на открытие."
- excerpt_id: L01-p14
  source_id: L01
  label: п. 14
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 21219
  end: 21588
  text: 14. Банк обеспечивает осуществление кассовых операций кассовыми работниками, лицами, ответственными за сохранность наличных денег, в соответствии с их должностными обязанностями, а также распределение их должностных обязанностей, исключающее конфликт интересов и условия его возникновения, совершение хищения наличных денег и ценностей и других противоправных действий.
- excerpt_id: L01-p75
  source_id: L01
  label: п. 75 (вход в кладовую/сейфовую комнату)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 54955
  end: 55205
  text: 75. Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег.
- excerpt_id: L01-p76
  source_id: L01
  label: п. 76 (ключи)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 55207
  end: 55373
  text: 76. Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся у лиц, ответственных за сохранность наличных денег.
- excerpt_id: L01-p77
  source_id: L01
  label: п. 77
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 55375
  end: 55547
  text: 77. Наличные деньги в кладовой и (или) сейфовой комнате хранятся раздельно по виду валюты, по номиналам банкнот и монет в металлических шкафах, стеллажах, сейфах, тележках.
- excerpt_id: L01-p78
  source_id: L01
  label: п. 78
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 55550
  end: 55794
  text: 78. Перед закрытием кладовой и (или) сейфовой комнаты лица, ответственные за сохранность наличных денег, проверяют соответствие фактического наличия в кладовой и (или) сейфовой комнате наличных денег остатку кассы и данным бухгалтерского учета.
- excerpt_id: L01-p80
  source_id: L01
  label: п. 80 (ключи от устройств на рабочем месте)
  text_file: L01-2026-10-17.txt
  text_sha256: 8a528e5b3dd5d4d750ca671764d6350dc29c6dee828013ba1dab552cf237c182
  start: 56140
  end: 56613
  text: 80. Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.
- excerpt_id: L02-item4-head
  source_id: L02
  label: п. 4 Перечня (изменения в НБРК № 231)
  text_file: L02-2026-10-17.txt
  text_sha256: 5396db5727a623e4adf2e3202a972a32e3c34312bb3a902f357a6b1e258001d5
  start: 11464
  end: 12004
  text: '4. Внести в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231 "Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей" (зарегистрировано в Реестре государственной регистрации нормативных правовых актов под № 19680) следующие изменения:'
- excerpt_id: L05-p2-3
  source_id: L05
  label: п. 2 пп. 3) (кассовый узел)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 6369
  end: 6571
  text: 3) кассовый узел – система специально оборудованных помещений, предназначенных для осуществления банком, инкассаторской организацией кассовых операций, операций по инкассации банкнот, монет и ценностей;
- excerpt_id: L05-p2-9
  source_id: L05
  label: п. 2 пп. 9) (операционный зал)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 7199
  end: 7333
  text: 9) операционный зал – помещение, предназначенное для банковского обслуживания клиентов, расположенное вне кассового узла перед кассой;
- excerpt_id: L05-p2-12
  source_id: L05
  label: п. 2 пп. 12)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 7704
  end: 7900
  text: 12) погрузочно-разгрузочная площадка – специально выделенное место для осуществления погрузочно-разгрузочных работ с наличными деньгами и ценностями, исключающее доступ и просмотр посторонних лиц.
- excerpt_id: L05-p7
  source_id: L05
  label: п. 7
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 10615
  end: 10894
  text: "7. Кассовый узел включает следующие помещения:\n 1) кладовая и (или) сейфовая комната;\n 2) предкладовая (при наличии кладовой);\n 3) касса;\n 4) помещение для пересчета наличных денег.\n Необходимость наличия помещения для пересчета наличных денег определяется банком самостоятельно."
- excerpt_id: L05-p8
  source_id: L05
  label: п. 8 (изоляция, один закрывающийся служебный вход)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 11102
  end: 11441
  text: "8. Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом. \n Допускается оборудовать дополнительный закрывающийся вход для осуществления погрузочно-разгрузочных работ с наличными деньгами и ценностями в боксе или на погрузочно-разгрузочной площадке."
- excerpt_id: L05-p13-3
  source_id: L05
  label: п. 13 пп. 3) (ред. на период приостановления)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 13942
  end: 14363
  text: "Действие подпункта 3) приостановлено до 01.01.2027 постановлением Правления Национального Банка РК от 24.12.2024 № 88 установив, что в период приостановления данный подпункт действует в следующей редакции:\n 3) дверь сейфовой комнаты металлическая, толщиной не менее 4 (четыре) миллиметра, закрывающаяся на два замка. В этом же проеме устанавливается внутренняя решетчатая металлическая дверь, закрывающаяся на один замок."
- excerpt_id: L05-p16
  source_id: L05
  label: п. 16 (ред. на период приостановления)
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 15327
  end: 16639
  text: "Действие пункта 16 приостановлено до 01.01.2027 постановлением Правления Национального Банка РК от 24.12.2024 № 88 установив, что в период приостановления данный пункт действует в следующей редакции:\n 16. Устройство помещения кассы (касс) соответствуют следующим параметрам:\n 1) каждая касса имеет отдельный вход с закрывающейся на замок дверью;\n 2) стены, потолок и пол кассы оборудуются защитными средствами, обеспечивающими безопасность кассового работника;\n 3) передняя часть кассы имеет оконный проем, оборудованный защитными средствами, обеспечивающими безопасность кассового работника и исключающие возможность хищения наличных денег и ценностей;\n 4) передняя часть кассы оборудуется специальными транспортирующими устройствами для передачи наличных денег и ценностей. Механизм приведения в действие и фиксации транспортирующего устройства находится внутри кассы в исправном состоянии.\n Допускается оборудовать нижнюю переднюю часть кассы инкассаторским бункером, позволяющим принимать\
    \ и выдавать более 10 (десяти) пачек банкнот и (или) 5 (пяти) мешков монет;\n 5) между кассами оборудуются перегородки, отделяющие кассы и соответственно рабочие места кассовых работников между собой;\n 6) касса оборудуется видеокамерами системы видеонаблюдения;\n 7) касса оборудуется переговорным устройством (микрофоном)."
- excerpt_id: L05-p21
  source_id: L05
  label: п. 21
  text_file: L05-2026-10-17.txt
  text_sha256: 2719a5c9ceef7e2bbec396df8122126e4ae70afc710d22ebb1a7d262482ae136
  start: 18574
  end: 18948
  text: "21. Для осуществления инкассации банкнот, монет и ценностей оборудуется помещение бокса, примыкающее к входу кассового узла, с закрывающейся на замок дверью либо погрузочно-разгрузочная площадка.\n При устройстве бокса или погрузочно-разгрузочной площадки обеспечивается ограничение доступа и просмотра третьими лицами за осуществлением инкассации банкнот, монет и ценностей."
- excerpt_id: L06-p4
  source_id: L06
  label: п. 4 постановления (введение в действие)
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 1154
  end: 1287
  text: 4. Настоящее постановление вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования.
- excerpt_id: L06-p3
  source_id: L06
  label: 'п. 3 (сфера: РКО вместимостью 200+ человек)'
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 2721
  end: 3060
  text: 3. Инструкция в соответствии с постановлением Правительства Республики Казахстан от 12 апреля 2021 года № 234 "Об утверждении Правил и критериев отнесения объектов к уязвимым в террористическом отношении" распространяется на расчетно-кассовые отделения, рассчитанные на одновременное пребывание (вместимостью) 200 (двести) и более человек.
- excerpt_id: L06-p5-1
  source_id: L06
  label: п. 5 пп. 1)
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 4336
  end: 4528
  text: 1) расчетно-кассовые отделения – специально оборудованные помещения банков второго уровня, предназначенные для проведения кассовых операций и операций по инкассации банкнот, монет и ценностей;
- excerpt_id: L06-p8-1
  source_id: L06
  label: п. 8 пп. 1)
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 8044
  end: 8546
  text: "8. Антитеррористическая защищенность расчетно-кассового отделения обеспечивается созданием условий, направленных на:\n 1) воспрепятствование неправомерному проникновению в расчетно-кассовое отделение, которое достигается принятием мер по:\n установлению пропускного режима в расчетно-кассовом отделении и его неукоснительному соблюдению;\n укреплению расчетно-кассового отделения в инженерно-техническом отношении средствами, позволяющими выявить неправомерное проникновение в расчетно-кассовое отделение;"
- excerpt_id: L06-p13
  source_id: L06
  label: п. 13
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 12774
  end: 12996
  text: 13. Пропускной режим в расчетно-кассовом отделении осуществляется согласно порядку организации пропускного режима, разрабатываемому в расчетно-кассовом отделении и утвержденному руководителем рассчетно-кассового отделения.
- excerpt_id: L06-p14
  source_id: L06
  label: п. 14
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 12998
  end: 13597
  text: "14. Пропускной режим предназначен для того, чтобы исключить:\n 1) проникновение в расчетно-кассовое отделение или его части (зоны) посторонних лиц с противоправными намерениями;\n 2) пронос (ввоз) и вынос (вывоз) с территории расчетно-кассового отделения предметов и веществ легковоспламеняющихся, отравляющих веществ, огнестрельного оружия и предметов, использование которых представляет опасность для расчетно-кассового отделения и находящихся лиц. Перечень предметов, запрещенных к проносу в расчетно-кассовое отделение, уязвимое в террористическом отношении, определен в приложении 2 к Инструкции."
- excerpt_id: L06-p15
  source_id: L06
  label: п. 15
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 13599
  end: 15023
  text: "15. Пропускной режим предусматривает:\n 1) организацию пункта и (или) поста охраны и (или) пропуска с функцией контроля на входах (выходах) в расчетно-кассовое отделение;\n 2) порядок пропуска в расчетно-кассовое отделение и (или) его части (зоны) работников и посетителей;\n 3) зонирование расчетно-кассового отделения (устанавливается не менее двух основных зон: первая зона – здания, территории, помещения, доступ в которые работникам, посетителям не ограничен; вторая зона – здания и (или) помещения доступ в которые разрешен работникам и посетителям согласно порядку организации пропускного режима рассчетно-кассового отделения);\n 4) определение перечня лиц актом руководителя расчетно-кассового отделения, имеющих право беспрепятственного допуска в расчетно-кассовое отделение;\n 5) определение перечня лиц актом руководителя расчетно-кассового отделения, допускаемых в зоны ограниченного доступа в расчетно-кассовое отделение;\n 6) введение и (или) организацию пропускной системы, способной\
    \ обеспечить контроль управления допуском работников и посетителей в расчетно-кассовое отделение и отдельные зоны согласно порядку организации пропускного режима в рассчетно-кассовом отделении; \n 7) определение перечня предметов, запрещенных к проносу в расчетно-кассовое отделение; \n 8) охрану критических зон расчетно-кассового отделения;\n 9) контроль за местами возможного массового пребывания людей в расчетно-кассовом отделении."
- excerpt_id: L06-p16
  source_id: L06
  label: п. 16
  text_file: L06-2026-10-17.txt
  text_sha256: 2cd78ff2994401780908548e7c96ff304bb80a75deb98460c2a65d3c28dbc209
  start: 15025
  end: 16427
  text: "16. В случае заключения договора об оказании охранных услуг с субъектом охранной деятельности собственник, владелец, руководитель расчетно-кассового отделения указывает в договоре об оказании охранных услуг мероприятия, реализуемые субъектом охранной деятельности по обеспечению антитеррористической защищенности расчетно-кассового отделения и должного уровня безопасности, к которым относятся:\n 1) организация допуска работников и посетителей в расчетно-кассовое отделение или его части (зоны);\n 2) организация пропуска транспортных средств на территорию расчетно-кассового отделения;\n 3) выявление на территории расчетно-кассового отделения лиц с противоправными намерениями, а также предметов и веществ, использование которых представляет опасность для рассчетно-кассового отделения и находящихся в рассчетно-кассовом отделении лиц;\n 4) охрана расчетно-кассового отделения, защита критических зон, в том числе исключение бесконтрольного пребывания на них посторонних лиц;\n 5) контроль\
    \ за местами возможного массового пребывания людей в расчетно-кассовом отделении;\n 6) организация учебных мероприятий с сотрудниками охраны по исполнению мероприятий первичного реагирования, направленных на минимизацию и ликвидацию угроз техногенного характера, возникших в результате совершенного акта терроризма;\n 7) надлежащее использование технических средств защиты, установленных в расчетно-кассовом отделении."
