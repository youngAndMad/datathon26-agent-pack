  quote_verbatim: "15. Пропускной режим предусматривает:\n 1) организацию пункта и (или) поста охраны и (или) пропуска с функцией контроля на входах (выходах) в расчетно-кассовое отделение;\n 2) порядок пропуска в расчетно-кассовое отделение и (или) его части (зоны) работников и посетителей;\n 3) зонирование расчетно-кассового отделения (устанавливается не менее двух основных зон: первая зона – здания, территории, помещения, доступ в которые работникам, посетителям не ограничен; вторая зона – здания и (или) помещения доступ в которые разрешен работникам и посетителям согласно порядку организации пропускного режима рассчетно-кассового отделения);\n 4) определение перечня лиц актом руководителя расчетно-кассового отделения, имеющих право беспрепятственного допуска в расчетно-кассовое отделение;\n 5) определение перечня лиц актом руководителя расчетно-кассового отделения, допускаемых в зоны ограниченного доступа в расчетно-кассовое отделение;\n 6) введение и (или) организацию пропускной системы,\
    \ способной обеспечить контроль управления допуском работников и посетителей в расчетно-кассовое отделение и отдельные зоны согласно порядку организации пропускного режима в рассчетно-кассовом отделении; \n 7) определение перечня предметов, запрещенных к проносу в расчетно-кассовое отделение; \n 8) охрану критических зон расчетно-кассового отделения;\n 9) контроль за местами возможного массового пребывания людей в расчетно-кассовом отделении."
  effective_status: 'действует (status new, is_actual); опубл. ЭКБ 14.05.2024; в силе с 25.05.2024; сфера п.3: РКО вместимостью 200+ человек'
