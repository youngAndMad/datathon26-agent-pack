  quote_verbatim: "14. Пропускной режим предназначен для того, чтобы исключить:\n 1) проникновение в расчетно-кассовое отделение или его части (зоны) посторонних лиц с противоправными намерениями;\n 2) пронос (ввоз) и вынос (вывоз) с территории расчетно-кассового отделения предметов и веществ легковоспламеняющихся, отравляющих веществ, огнестрельного оружия и предметов, использование которых представляет опасность для расчетно-кассового отделения и находящихся лиц. Перечень предметов, запрещенных к проносу в расчетно-кассовое отделение, уязвимое в террористическом отношении, определен в приложении 2 к Инструкции."
  effective_status: 'действует (status new, is_actual); опубл. ЭКБ 14.05.2024; в силе с 25.05.2024; сфера п.3: РКО вместимостью 200+ человек'
