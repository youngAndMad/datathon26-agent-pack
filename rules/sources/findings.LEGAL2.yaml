  quote_verbatim: "16. В случае заключения договора об оказании охранных услуг с субъектом охранной деятельности собственник, владелец, руководитель расчетно-кассового отделения указывает в договоре об оказании охранных услуг мероприятия, реализуемые субъектом охранной деятельности по обеспечению антитеррористической защищенности расчетно-кассового отделения и должного уровня безопасности, к которым относятся:\n 1) организация допуска работников и посетителей в расчетно-кассовое отделение или его части (зоны);\n 2) организация пропуска транспортных средств на территорию расчетно-кассового отделения;\n 3) выявление на территории расчетно-кассового отделения лиц с противоправными намерениями, а также предметов и веществ, использование которых представляет опасность для рассчетно-кассового отделения и находящихся в рассчетно-кассовом отделении лиц;\n 4) охрана расчетно-кассового отделения, защита критических зон, в том числе исключение бесконтрольного пребывания на них посторонних лиц;\n 5)\
    \ контроль за местами возможного массового пребывания людей в расчетно-кассовом отделении;\n 6) организация учебных мероприятий с сотрудниками охраны по исполнению мероприятий первичного реагирования, направленных на минимизацию и ликвидацию угроз техногенного характера, возникших в результате совершенного акта терроризма;\n 7) надлежащее использование технических средств защиты, установленных в расчетно-кассовом отделении."
  effective_status: 'действует (status new, is_actual); опубл. ЭКБ 14.05.2024; в силе с 25.05.2024; сфера п.3: РКО вместимостью 200+ человек'
